  </script><main><div class="container" style="padding-top: 40px;"><h1>Search</h1><input class="search-box" id="q" type="search" placeholder="Search posts…" style="margin: 0 0 24px;"><div id="results" class="grid"></div></div><script>(function(){const data = [{"id":"my-test-post-title","title":"My Test Post Title","description":"One-line summary of the post.","tags":["rust","systems"],"date":"Oct 28, 2026","body":"Write your post here.\n\n## Section\n\n```rust\nfn main() {\n    println!(\"hello\");\n}\n```\n\nInline math: $O(n \\log n)$. Block math:\n\n$$\nT(n) = \\sum_{i=1}^{n} i = \\frac{n(n+1)}{2}\n$$"},{"id":"amortized-analysis","title":"Amortized Analysis: Why Vec::push is O(1)","description":"Aggregate, accounting, and potential methods explained with Rust's Vec growth strategy.","tags":["rust","algorithms","complexity","math"],"date":"Mar 5, 2026","body":"`Vec::push` is $O(1)$ *amortized*, even though occasionally it's $O(n)$ (when reallocating). How?\n\n## The growth strategy\n\nRust's `Vec` doubles capacity when full. Pushing $n$ elements costs:\n\n$$\nT(n) = n + \\frac{n}{2} + \\frac{n}{4} + \\cdots + 1 = 2n = O(n)\n$$\n\nSo average per push = $O(1)$.\n\n## Three methods\n\n### 1. Aggregate\n\nTotal cost over $n$ ops $\\le cn$, so amortized $= c$.\n\n### 2. Accounting\n\nCharge each push $3$ credits: $1$ for the push, $2$ saved for future copy. When resize happens, saved credits pay for moving. Balance never negative.\n\n### 3. Potential\n\nDefine potential $\\Phi(D) = 2 \\cdot \\text{size} - \\text{capacity}$ (or similar). Amortized cost $= \\text{actual} + \\Delta\\Phi$. Resizes have $\\Delta\\Phi$ negative enough to cancel.\n\n## Generalizing\n\nAny structure that grows geometrically (factor $>1$) has $O(1)$ amortized append. Hash maps, dynamic arrays, rope buffers all rely on this.\n\n## Caveat\n\nAmortized bounds assume you keep the structure alive. If you `push` then immediately `drop`, you paid $O(n)$ for nothing — but that's fine, total work still $O(n)$.\n\n## Rust note\n\n`Vec::with_capacity(n)` avoids all reallocations if you know the size. Use it in hot paths:\n\n```rust\nlet mut v = Vec::with_capacity(1024);\nfor i in 0..1024 { v.push(i); } // zero reallocs\n```"},{"id":"cache-friendly-rust","title":"Cache-Friendly Data Structures in Rust","description":"AoS vs SoA, cache lines, prefetching, and how to make your Rust code 10x faster without changing the algorithm.","tags":["rust","performance","cache","memory"],"date":"Feb 20, 2026","body":"CPUs are fast; memory is slow. A cache miss costs ~100 cycles. The fix is usually **layout**, not algorithm.\n\n## Array of Structs vs Struct of Arrays\n\n```rust\n// AoS: good for \"process one entity fully\"\nstruct Particle { x: f32, y: f32, z: f32, vx: f32, vy: f32, vz: f32 }\nlet particles: Vec\u003cParticle>;\n\n// SoA: good for \"process one field across all entities\"\nstruct Particles {\n    x: Vec\u003cf32>, y: Vec\u003cf32>, z: Vec\u003cf32>,\n    vx: Vec\u003cf32>, vy: Vec\u003cf32>, vz: Vec\u003cf32>,\n}\n```\n\nIf you only need positions, SoA loads 3 floats per cache line instead of 6. ~2x bandwidth.\n\n## Cache line = 64 bytes\n\nA `Vec\u003cu8>` of 64 elements fits one line. A `Vec\u003ci64>` of 8 fits one line. Align hot structs:\n\n```rust\n#[repr(align(64))]\nstruct HotCounter { value: AtomicU64 }\n```\n\nAvoid **false sharing**: two threads writing adjacent fields in the same cache line cause cache-line bouncing. Pad or align.\n\n## Prefetching\n\n```rust\n// manual prefetch (nightly / intrinsics)\nuse std::intrinsics::prefetch_read_data;\nunsafe { prefetch_read_data(ptr, 3); }\n```\n\nUsually the hardware prefetcher handles sequential access. Help it by keeping access patterns linear.\n\n## Branch prediction\n\nSort data so branches are predictable, or use branchless code:\n\n```rust\n// branchy\nif x > 0 { a += x } else { a -= x }\n// branchless\na += x.abs();\n```\n\n## Measuring cache behavior\n\n```bash\nperf stat -e L1-dcache-load-misses,LLC-load-misses ./target/release/bin\n```\n\nOr `cachegrind` via `valgrind --tool=cachegrind`.\n\n## Checklist\n\n- [ ] Profile first\n- [ ] Prefer `Vec` over `LinkedList`\n- [ ] SoA for columnar workloads\n- [ ] Align hot atomics to 64 bytes\n- [ ] Avoid `clone` in inner loops\n- [ ] Use `#[repr(C)]` for FFI / predictable layout"},{"id":"rust-zero-cost","title":"Zero-Cost Abstractions in Rust: What the Compiler Actually Does","description":"Traits, generics and iterators compile down to the same code you'd write by hand. Here's how to verify it with cargo-asm and perf.","tags":["rust","performance","optimization","llvm"],"date":"Feb 2, 2026","body":"\"Zero-cost abstraction\" is Rust's promise: you don't pay for what you don't use, and what you do use is as fast as hand-written code. Let's test that claim.\n\n## Iterators vs loops\n\n```rust\nlet sum: i64 = (0..1_000_000).filter(|x| x % 2 == 0).map(|x| x * x).sum();\n```\n\nvs\n\n```rust\nlet mut sum = 0i64;\nfor x in 0..1_000_000 {\n    if x % 2 == 0 { sum += x * x; }\n}\n```\n\nWith `cargo rustc --release -- --emit=asm` (or `cargo-asm`), both produce essentially identical LLVM IR and final assembly. The iterator chain is inlined and fused into a single loop.\n\n## Generics and monomorphization\n\nGeneric functions are compiled once per concrete type:\n\n```rust\nfn max\u003cT: Ord>(a: T, b: T) -> T { if a > b { a } else { b } }\n```\n\n`max::\u003ci32>` and `max::\u003cf64>` become two separate functions. No vtable, no boxing. Cost: larger binary, longer compile. Benefit: full inlining and specialization.\n\n## When abstractions *do* cost\n\n- **`dyn Trait`** (trait objects) use dynamic dispatch (vtable). Use when you need heterogeneous collections.\n- **`Box\u003cdyn Trait>`** adds a heap allocation.\n- **`Rc`/`Arc`** add reference counting overhead.\n- **Bounds checks** on slices (`slice[i]`) — use `.get(i)` or iterators, or `unsafe` with `get_unchecked` after proving safety.\n\n## Measuring\n\n```bash\ncargo build --release\nperf stat -e cache-misses,branch-misses ./target/release/mybin\n```\n\nOr use `criterion` for micro-benchmarks:\n\n```rust\nuse criterion::{black_box, criterion_group, criterion_main, Criterion};\nfn bench(c: &mut Criterion) {\n    c.bench_function(\"sum squares\", |b| b.iter(|| black_box((0..1000).filter(|x| x%2==0).map(|x|x*x).sum::\u003ci64>())));\n}\ncriterion_group!(benches, bench);\ncriterion_main!(benches);\n```\n\n## Tips\n\n1. Profile before optimizing (`cargo flamegraph`).\n2. Prefer iterators — they compose and optimize well.\n3. Avoid `clone()` in hot loops; borrow or move.\n4. Use `#[inline]` sparingly; trust the optimizer.\n5. Check `#[cold]` / `#[likely]` hints (nightly) for branch prediction.\n\n## Summary\n\nZero-cost doesn't mean zero *compile* cost or zero *binary* cost. It means no runtime overhead vs the best hand-written equivalent. Measure to confirm."},{"id":"btree-from-scratch","title":"B-Trees from Scratch in Rust","description":"How B-trees store sorted data on disk, why they beat binary search trees for databases, and a from-scratch Rust implementation.","tags":["rust","data-structures","databases","btree"],"date":"Jan 15, 2026","body":"A **B-tree** is the workhorse behind almost every database index and file system. Unlike a binary search tree, a B-tree node holds *many* keys and *many* children, which keeps the tree shallow and turns random disk access into sequential reads.\n\n## Why not a BST?\n\nA balanced BST has height $O(\\log n)$, but with $n = 10^9$ that's ~30 levels. Each level may be a disk seek (~10ms on HDD). That's 300ms per lookup — unacceptable.\n\nA B-tree of order $m$ has height\n\n$$\nh \\approx \\log_m n\n$$\n\nFor $m = 100$ and $n = 10^9$: $h \\approx 4.5$, i.e. ~5 disk reads. **Six times fewer.**\n\n## Node layout\n\nEach node stores up to $m-1$ keys and $m$ child pointers. Keys are sorted; a child between keys $k_i, k_{i+1}$ contains keys in $[k_i, k_{i+1})$.\n\n```rust\n#[derive(Debug)]\nstruct Node\u003cK, V> {\n    keys: Vec\u003cK>,\n    vals: Vec\u003cV>,\n    children: Vec\u003cBox\u003cNode\u003cK, V>>>,\n    leaf: bool,\n}\n\nimpl\u003cK: Ord, V> Node\u003cK, V> {\n    fn new(leaf: bool) -> Self {\n        Self { keys: Vec::new(), vals: Vec::new(), children: Vec::new(), leaf }\n    }\n    fn is_full(&self, t: usize) -> bool {\n        // t = minimum degree; max keys = 2t - 1\n        self.keys.len() == 2 * t - 1\n    }\n}\n```\n\n## Splitting a full node\n\nWhen inserting into a full node we split it in the middle, promoting the median key to the parent.\n\n```rust\nfn split_child(parent: &mut Node\u003cK, V>, idx: usize, t: usize) {\n    let mut full = std::mem::replace(&mut parent.children[idx], Box::new(Node::new(true)));\n    // full has 2t-1 keys; split into two nodes of t-1 keys\n    let mut right = Node::new(full.leaf);\n    right.keys = full.keys.split_off(t);\n    let median = full.keys.pop().unwrap();   // the t-th key (0-indexed: t-1)\n    // move corresponding values/children...\n    full.keys.truncate(t - 1);\n    parent.keys.insert(idx, median);\n    parent.children.insert(idx + 1, Box::new(right));\n    parent.children[idx] = Box::new(full);\n}\n```\n\n> Note: in production you'd move values and child pointers together; the above sketches the key bookkeeping.\n\n## Search\n\n```rust\nfn search\u003cK: Ord, V>(node: &Node\u003cK, V>, key: &K) -> Option\u003c&V> {\n    let i = node.keys.binary_search(key).unwrap_or_else(|x| x);\n    if i \u003c node.keys.len() && node.keys[i] == *key {\n        return Some(&node.vals[i]);\n    }\n    if node.leaf { return None; }\n    search(&node.children[i], key)\n}\n```\n\nUsing `binary_search` keeps each node visit $O(\\log m)$, but $m$ is small (hundreds), so the constant dominates.\n\n## Complexity\n\n| Operation | Time | Disk reads |\n|-----------|------|------------|\n| Search    | $O(\\log n)$ | $O(\\log_m n)$ |\n| Insert    | $O(\\log n)$ amortized | $O(\\log_m n)$ |\n| Delete    | $O(\\log n)$ | $O(\\log_m n)$ |\n| Range scan| $O(\\log n + k)$ | sequential |\n\n## Rust-specific tips\n\n- Use `Box\u003cNode>` for recursive types (Rust needs sized types).\n- Prefer `Vec` over linked lists; cache locality matters more than pointer chasing.\n- For persistence, serialize nodes to fixed-size pages (4KB) and use an arena/pool allocator.\n- `BTreeMap` in `std::collections` is a B-tree (not a red-black tree) — great for in-memory ordered maps.\n\n## Further reading\n\n- Comer, \"Ubiquitous B-Tree\" (1979).\n- SQLite file format (btree.c).\n- `std::collections::BTreeMap` source in rust-lang/rust."}];

    const input = document.getElementById('q');
    const results = document.getElementById('results');
    const params = new URLSearchParams(location.search);
    if (params.get('q')) input.value = params.get('q');
    function render(q) {
      q = q.trim().toLowerCase();
      results.innerHTML = '';
      if (!q) { results.innerHTML = '<p style="color:var(--fg-muted)">Type to search…</p>'; return; }
      const hits = data.filter(p =>
        p.title.toLowerCase().includes(q) ||
        p.description.toLowerCase().includes(q) ||
        p.tags.join(' ').toLowerCase().includes(q) ||
        p.body.toLowerCase().includes(q)
      );
      if (!hits.length) { results.innerHTML = '<p style="color:var(--fg-muted)">No results.</p>'; return; }
      for (const p of hits) {
        const a = document.createElement('a');
        a.className = 'post-card';
        a.href = '/posts/' + p.id;
        a.innerHTML = `<h3>${p.title}</h3><p class="desc">${p.description}</p><div class="meta">${p.date} · ${p.tags.join(', ')}</div>`;
        results.appendChild(a);
      }
    }
    input.addEventListener('input', () => render(input.value));
    render(input.value);
